services:
  - type: web
    name: dmastru-jobcard-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dmastru-jobcard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: JWT_EXPIRY_MINUTES
        value: "30"
      - key: UPLOAD_DIR
        # Free web services have ephemeral storage; uploaded files can disappear on restart/spin-down.
        value: /tmp/dmastru-uploads
      - key: HTTPS_ENABLED
        value: "true"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: LOGIN_RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: MFA_REQUIRED
        value: "false"
      # Set this in Render after the static site's URL is known.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      # Required only on first deployment to create the first Admin without shell access.
      # Remove these three variables after confirming Admin login.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_SSL
        value: "false"

  - type: web
    name: dmastru-jobcard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Enter the public API URL, e.g. https://dmastru-jobcard-api.onrender.com
      - key: VITE_API_URL
        sync: false

databases:
  - name: dmastru-jobcard-db
    postgresMajorVersion: "16"
    plan: free
